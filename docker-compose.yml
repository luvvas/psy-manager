services:
  db:
    image: postgres:17-alpine
    container_name: psy-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-psy_manager}
    # Só na própria máquina: nada de banco de dev aberto para a rede.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-psy_manager}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
