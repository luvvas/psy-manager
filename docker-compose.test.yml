name: psy-manager-test

services:
  db-test:
    image: postgres:17-alpine
    container_name: psy-manager-db-test
    environment:
      POSTGRES_USER: psy_test
      POSTGRES_PASSWORD: psy_test
      POSTGRES_DB: psy_manager_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psy_test -d psy_manager_test"]
      interval: 2s
      timeout: 3s
      retries: 15
