# Servido pelo container `web` em produção. Não fica exposto à internet: o
# cloudflared (no host) encaminha o tráfego do Tunnel para 127.0.0.1:8080, e o nginx serve o SPA
# e faz proxy de /api, /trpc e /ws para a API na rede interna do Docker.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Content-Security-Policy (auditoria F4), por enquanto só em Report-Only: o
# navegador mostra as violações no console sem bloquear nada. Depois de usar o
# app (login, PDFs no R2, videochamada, Sentry) sem violações, troque o header
# para "Content-Security-Policy" para passar a bloquear.
# - style-src 'unsafe-inline': React (style=), sonner e o <style> do chart.
# - *.r2.cloudflarestorage.com: upload (PUT) e visualização (iframe) de PDFs.
# - data: em frame-src: PDFs antigos gravados inline no banco.
map $host $content_security_policy {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https://*.r2.cloudflarestorage.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-src 'self' https://*.r2.cloudflarestorage.com data: blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera/microphone precisam ficar liberados para a própria origem: a
    # videochamada (WebRTC) depende deles.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only $content_security_policy always;

    # Assets do Vite têm hash no nome: podem ficar em cache para sempre, no
    # navegador e na borda da Cloudflare.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(api|trpc|ws)(/|$) {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # App shell: nunca em cache, para o index.html sempre apontar para os
    # assets do deploy atual.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only $content_security_policy always;
    }
}
