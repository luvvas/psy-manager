# Servido pelo container `web` em produção. Não fica exposto à internet: o
# cloudflared (no host) encaminha o tráfego do Tunnel para 127.0.0.1:8080, e o nginx serve o SPA
# e faz proxy de /api, /trpc e /ws para a API na rede interna do Docker.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera/microphone precisam ficar liberados para a própria origem: a
    # videochamada (WebRTC) depende deles.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # Assets do Vite têm hash no nome: podem ficar em cache para sempre, no
    # navegador e na borda da Cloudflare.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(api|trpc|ws)(/|$) {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # App shell: nunca em cache, para o index.html sempre apontar para os
    # assets do deploy atual.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    }
}
